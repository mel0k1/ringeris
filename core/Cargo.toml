[package]
name = "ringeris-core"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0"
description = "Ringeris antivirus core"
repository = "https://github.com/mel0k1/ringeris"

[lib]
name = "ringeris_core"
path = "src/lib.rs"

[[bin]]
name = "ringeris-core"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
cab = "0.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
sevenz-rust = "0.6"
walkdir = "2"
notify = "6"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
thiserror = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
